name: o_forneau
description: "Ô Forneau ! — l'app qui dit quoi cuisiner ce soir, avec ce qu'on a."
publish_to: 'none'
version: 1.5.1+14

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  purchases_flutter: ^11.0.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/recipes.json
    - assets/data/i18n/
