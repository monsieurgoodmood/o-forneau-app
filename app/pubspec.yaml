name: o_forneau
description: "Ô Forneau ! — l'app qui dit quoi cuisiner ce soir, avec ce qu'on a."
publish_to: 'none'
version: 1.9.3+25

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8   # réclamée par les widgets Cupertino internes au framework ;
                            # sans elle, ces icônes sortent en carrés vides sur iOS.
                            # L élagage la réduit à quelques kilo-octets.
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  purchases_flutter: ^11.0.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  wakelock_plus: ^1.2.8
  # Notifications push : transport seulement (pas d'Analytics, pas de Crashlytics).
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/recipes.json
    - assets/data/i18n/

  # Polices embarquées, pas téléchargées. Le paquet google_fonts allait les chercher sur
  # fonts.gstatic.com au premier lancement : cela envoyait l'adresse IP de chaque
  # utilisateur à Google sans son consentement, et les titres s'affichaient dans une
  # police de secours tant que le réseau ne répondait pas. Instances statiques
  # sous-ensemblées au latin étendu — les sept langues de l'app et rien de plus :
  # 428 Ko embarqués contre 1,18 Mo téléchargés. Licence OFL dans assets/fonts/.
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Icône de l'app — celle de la marque, pas celle de Flutter. Apple a refusé la 1.1.1 (2.3.8 :
# « placeholder icons ») parce que l'icône par défaut était restée. `dart run flutter_launcher_icons`
# régénère iOS (AppIcon.appiconset) et Android (mipmaps + icône adaptative).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon-1024.png
  adaptive_icon_background: "#2D4A2B"
  adaptive_icon_foreground: assets/icon/foreground-1024.png
