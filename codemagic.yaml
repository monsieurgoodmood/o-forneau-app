# Build iOS (macOS cloud) pour Ô Forneau ! — application NATIVE Flutter (dossier app/).
# Ce fichier DOIT être à la racine du dépôt (seul endroit où Codemagic le cherche).
#
# Prérequis UI Codemagic (déjà en place) :
#   - Groupe de variables « forneau_ios » avec CERT_KEY_B64 (clé privée RSA PEM en base64, une ligne).
#   - Intégration App Store Connect « smartwatches » (même compte Apple).
workflows:
  ios-release:
    name: Ô Forneau ! — iOS natif → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: smartwatches
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups: [forneau_ios]
      vars:
        BUNDLE_ID: "com.maisonforneau.oforneau"
        APP_ID: "6832736305"
    scripts:
      - name: Signature iOS (certificats + profils)
        script: |
          echo "$CERT_KEY_B64" | base64 --decode > /tmp/certificate_key
          chmod 600 /tmp/certificate_key
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key=@file:/tmp/certificate_key \
            --create
          keychain initialize
          keychain add-certificates
      - name: Dépendances Flutter
        script: |
          cd app && flutter packages pub get
      - name: Pods iOS
        script: |
          # Génère Generated.xcconfig / la config Xcode (sans compiler), puis installe les pods.
          cd app && flutter build ios --release --no-codesign --config-only
          cd ios && pod install --repo-update
      - name: Appliquer les profils de signature
        script: |
          cd app/ios && xcode-project use-profiles
      - name: Build IPA
        script: |
          DERNIER=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || echo 0)
          N=$((DERNIER + 1))
          echo "build number retenu : $N (dernier TestFlight : $DERNIER)"
          # Les clés RevenueCat viennent du groupe de variables « forneau_ios » (chiffrées,
          # jamais dans ce dépôt public). Sans elles, l'app compile mais l'achat intégré reste muet.
          cd app && flutter build ipa --release \
            --build-name=1.4.0 --build-number="$N" \
            --dart-define=RC_IOS_KEY="$RC_IOS_KEY" \
            --dart-define=RC_ANDROID_KEY="$RC_ANDROID_KEY" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
